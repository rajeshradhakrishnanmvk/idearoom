<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Cluster Studio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="hero">
        <div class="hero-inner">
            <h1>Browser Cluster Studio</h1>
            <p>A real in-browser cluster runtime for learning and prototyping. Each workload executes user-supplied main.flow.js in a Web Worker.</p>
        </div>
    </header>

    <main class="layout" id="app-root">
        <section class="panel">
            <h2>Publish Flow Artifact</h2>
            <form id="artifact-form" class="stack">
                <label>
                    Namespace
                    <input type="text" name="namespace" placeholder="ideas" required>
                </label>
                <label>
                    Artifact Name
                    <input type="text" name="artifactName" placeholder="signal-processor" required>
                </label>
                <label>
                    Revision
                    <input type="text" name="revision" placeholder="r2026.05.18" required>
                </label>
                <label>
                    main.flow.js (required)
                    <textarea name="mainFlowSource" rows="12" spellcheck="false" required>self.mainFlow = {
  onStart(ctx) {
    ctx.memory.counter = 0;
    return { started: ctx.podName };
  },
  onTick(ctx) {
    ctx.memory.counter += 1;
    return {
      tick: ctx.tick,
      counter: ctx.memory.counter,
      node: ctx.nodeName
    };
  },
  onStop(ctx) {
    return { stoppedAtTick: ctx.tick };
  }
};</textarea>
                </label>
                <button type="submit">Publish Artifact</button>
            </form>
        </section>

        <section class="panel">
            <h2>Register Browser Node</h2>
            <form id="node-form" class="stack">
                <label>
                    Node Name
                    <input type="text" name="nodeName" placeholder="node-a" required>
                </label>
                <label>
                    Worker Capacity
                    <input type="number" name="workerCapacity" min="1" value="4" required>
                </label>
                <button type="submit">Add Node</button>
            </form>
        </section>

        <section class="panel">
            <h2>Launch Workload</h2>
            <form id="workload-form" class="stack">
                <label>
                    Artifact Revision
                    <select name="artifactRef" id="artifact-ref" required></select>
                </label>
                <label>
                    Workload Name Prefix
                    <input type="text" name="prefix" placeholder="flow-unit" required>
                </label>
                <label>
                    Replicas
                    <input type="number" name="replicas" min="1" value="1" required>
                </label>
                <label>
                    Scheduling Mode
                    <select name="scheduleMode" id="schedule-mode">
                        <option value="auto">Auto-Score</option>
                        <option value="manual">Manual Node</option>
                    </select>
                </label>
                <label>
                    Manual Node
                    <select name="manualNode" id="manual-node"></select>
                </label>
                <button type="submit">Launch</button>
            </form>
        </section>

        <section class="panel panel-wide">
            <div class="toolbar">
                <h2>Cluster Controls</h2>
                <div class="summary">
                    <button id="tick-all" type="button">Tick All Workloads</button>
                    <button id="stop-all" type="button">Stop All Workloads</button>
                </div>
            </div>
            <div id="cluster-summary" class="summary"></div>
        </section>

        <section class="panel panel-wide">
            <div class="toolbar">
                <h2>Artifacts</h2>
            </div>
            <div id="artifact-list" class="registry-list"></div>
        </section>

        <section class="panel panel-wide">
            <div class="toolbar">
                <h2>Workloads (Real Workers)</h2>
            </div>
            <div id="workload-list" class="registry-list"></div>
        </section>

        <section class="panel panel-wide">
            <div class="toolbar">
                <h2>Nodes</h2>
            </div>
            <div id="node-list" class="registry-list"></div>
        </section>

        <section class="panel panel-wide">
            <div class="toolbar">
                <h2>Cluster Events</h2>
            </div>
            <div id="event-list" class="registry-list"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
