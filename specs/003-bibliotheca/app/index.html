<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bibliotheca — Personal Library Management System. Browse, search, and track 122 books.">
  <title>Bibliotheca — My Library</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Skip navigation link for keyboard users -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Header with app title -->
  <header class="app-header" role="banner">
    <div class="app-header-inner">
      <div>
        <h1 class="app-title">📚 Bibliotheca</h1>
        <p class="app-subtitle" id="library-stats">Loading your library…</p>
      </div>
      <div class="header-actions">
        <button
          id="export-btn"
          class="header-icon-btn"
          type="button"
          aria-label="Export library to JSON"
          title="Export library as JSON"
        >📤</button>
        <button
          id="import-btn"
          class="header-icon-btn"
          type="button"
          aria-label="Import library from JSON"
          title="Import library from JSON"
        >📥</button>
        <input
          type="file"
          id="import-file-input"
          accept=".json,application/json"
          aria-hidden="true"
          tabindex="-1"
          hidden
        >
        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="Switch to dark mode"
          title="Toggle dark/light mode"
        >🌙</button>
      </div>
    </div>
  </header>

  <!-- Search: role="search" landmark per ARIA -->
  <div class="search-bar" role="search" aria-label="Search books">
    <label for="search-input" class="sr-only">Search by title or author</label>
    <input
      type="search"
      id="search-input"
      class="search-input"
      placeholder="Search by title or author…"
      aria-label="Search books by title or author"
      autocomplete="off"
    >
    <button
      class="search-clear"
      id="search-clear"
      aria-label="Clear search"
      type="button"
      hidden
    >&times;</button>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar" role="group" aria-label="Filter books by status">
    <button class="filter-btn filter-btn--active" data-filter="all" type="button">All</button>
    <button class="filter-btn" data-filter="unread" type="button">📖 Unread</button>
    <button class="filter-btn" data-filter="reading" type="button">📘 Reading</button>
    <button class="filter-btn" data-filter="read" type="button">✅ Read</button>
  </div>

  <!-- Main content: book grid -->
  <main id="main-content" class="main-content">
    <!-- Book grid rendered here by app.js -->
    <div id="book-grid" class="book-grid" role="list" aria-label="Book library">
      <p class="loading-message">Loading your library…</p>
    </div>

    <!-- Empty state (hidden by default) -->
    <div id="empty-state" class="empty-state" hidden>
      <p class="empty-message"></p>
    </div>
  </main>

  <!-- Add Book FAB -->
  <button
    id="add-book-btn"
    class="fab"
    type="button"
    aria-label="Add new book"
    title="Add new book"
  >＋</button>

  <!-- Add Book Dialog -->
  <dialog id="add-book-dialog" aria-label="Add new book" aria-modal="true">
    <form id="add-book-form" novalidate>
      <h2 class="dialog-title">📖 Add Book</h2>
      <div class="form-group">
        <label for="form-title">Title <span class="required" aria-hidden="true">*</span></label>
        <input type="text" id="form-title" name="title" required autocomplete="off" placeholder="Book title">
      </div>
      <div class="form-group">
        <label for="form-author">Author <span class="required" aria-hidden="true">*</span></label>
        <input type="text" id="form-author" name="author" required autocomplete="off" placeholder="Author name">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="form-language">Language</label>
          <select id="form-language" name="language">
            <option value="English">🇬🇧 English</option>
            <option value="Malayalam">🇮🇳 Malayalam</option>
          </select>
        </div>
        <div class="form-group">
          <label for="form-genre">Genre</label>
          <input type="text" id="form-genre" name="genre" placeholder="Fiction" autocomplete="off">
        </div>
      </div>
      <div class="form-group">
        <label for="form-pages">Total Pages <span class="required" aria-hidden="true">*</span></label>
        <input type="number" id="form-pages" name="totalPages" min="1" required placeholder="e.g. 320">
      </div>
      <div id="add-book-error" class="form-error" role="alert" hidden></div>
      <div class="form-actions">
        <button type="button" id="add-book-cancel" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Add Book</button>
      </div>
    </form>
  </dialog>

  <!-- Footer -->
  <footer class="app-footer" role="contentinfo">
    <p>Bibliotheca v1.0 — Zero dependencies. Your books, your browser.</p>
  </footer>

  <!-- Test harness: rendered inline, follows constitution TDD mandate -->
  <section id="test-harness" class="test-harness" aria-label="Test results" role="region">
    <h2 class="test-harness-title">🧪 Test Harness</h2>
    <div class="test-summary">
      <span id="test-pass-count" class="test-count test-pass">0 passed</span>
      <span id="test-fail-count" class="test-count test-fail">0 failed</span>
      <span id="test-total-count" class="test-count test-total">0 total</span>
    </div>
    <ol id="test-results" class="test-results" role="list"></ol>
  </section>

  <!-- Application module -->
  <script type="module" src="app.js"></script>
</body>
</html>
